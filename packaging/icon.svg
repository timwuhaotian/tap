<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tap's icon: "Bolt T", a heavy T whose stem breaks into a lightning bolt, on a warm
       plate. The source of truth for every icon file: `cargo xtask icon` renders
       packaging/app-icon.png, app-icon-dev.png (graphite plate) and docs/icon.png from it.
       The plate follows Apple's grid: 824 of 1024, corner radius 22.37%. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB238"/>
      <stop offset="1" stop-color="#FF5A36"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7A1E00" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184.3" fill="url(#plate)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="184.3" fill="url(#sheen)"/>
  <path id="mark" filter="url(#lift)" fill="#FFF8F0" stroke="#FFF8F0" stroke-width="24" stroke-linejoin="round"
        d="M262 232 H762 V382 H592 V518 L650 518 L470 800 L512 590 L432 590 V382 H262 Z"/>
</svg>
