[workspace]
resolver = "3"
members = ["crates/tap-core", "crates/tap-import", "crates/tap-shell", "crates/tap-app", "xtask"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT"
authors = ["timwuhaotian"]
repository = "https://github.com/timwuhaotian/tap"
homepage = "https://github.com/timwuhaotian/tap"
readme = "README.md"
keywords = ["browser", "macos", "webkit", "objc2", "web-browser"]
categories = ["gui"]
rust-version = "1.94"
publish = false

[workspace.dependencies]
# AppKit and WebKit from Rust (docs/PLAN.md §5). Pinned to one objc2 generation together.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-quartz-core = "0.3"
resvg = "0.49"
bitflags = "2"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tap-core = { path = "crates/tap-core" }
tap-import = { path = "crates/tap-import" }
tap-shell = { path = "crates/tap-shell" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "deny"
large_enum_variant = "deny"
needless_collect = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Never unwind through AppKit or WebKit frames (docs/PLAN.md §10).
panic = "abort"
debug = "line-tables-only"

# Cold code: run once per import or export (docs/PLAN.md §10).
[profile.release.package.tap-import]
opt-level = "s"
