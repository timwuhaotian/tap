<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Tap</title>
<style>
  :root { --ink: #1c1b1a; --quiet: #6b6762; --ground: #fbf8f4; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f4efe9; --quiet: #a39d96; --ground: #1c1b1a; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: var(--ground); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; -webkit-user-select: none;
  }
  main { text-align: center; max-width: 30em; padding: 2em; }
  svg { width: 96px; height: 96px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0.6em 0 0.2em; letter-spacing: -0.01em; }
  p { color: var(--quiet); margin: 0; }
</style>
</head>
<body>
<main>
  <svg viewBox="100 100 824 824" aria-hidden="true">
    <defs>
      <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFB238"/><stop offset="1" stop-color="#FF5A36"/>
      </linearGradient>
    </defs>
    <rect x="100" y="100" width="824" height="824" rx="184.3" fill="url(#plate)"/>
    <path fill="#FFF8F0" stroke="#FFF8F0" stroke-width="24" stroke-linejoin="round"
          d="M262 232 H762 V382 H592 V518 L650 518 L470 800 L512 590 L432 590 V382 H262 Z"/>
  </svg>
  <h1>Tap is being built</h1>
  <p>A small, fast browser for the Mac, written in Rust. The browser is being ported in,
     one piece at a time.</p>
</main>
</body>
</html>
